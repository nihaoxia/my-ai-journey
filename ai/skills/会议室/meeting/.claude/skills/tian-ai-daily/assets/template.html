<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜甜AI日报 - {{DATE}}</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: linear-gradient(165deg, #fdf6f0 0%, #fef0eb 40%, #fef5f3 70%, #fdf6f0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #3d2c2a;
            line-height: 1.6;
        }

        /* ============ 顶部装饰 ============ */
        .header-decoration {
            height: 4px;
            background: linear-gradient(90deg, #f0c4bd, #e8857c, #d4736a, #e8857c, #f0c4bd);
        }

        /* ============ Header ============ */
        .header {
            text-align: center;
            padding: 52px 24px 36px;
            position: relative;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(232,133,124,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .header .icon-row {
            font-size: 2.8em;
            margin-bottom: 12px;
            position: relative;
        }
        .header h1 {
            font-size: 2.3em;
            font-weight: 750;
            background: linear-gradient(135deg, #c96054 0%, #e8857c 50%, #d4736a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            position: relative;
            letter-spacing: 0.5px;
        }
        .header .subtitle {
            font-size: 0.95em;
            color: #b8958e;
            font-weight: 400;
            position: relative;
        }
        .header .date-divider {
            display: inline-block;
            width: 40px;
            height: 1px;
            background: #e0c4bd;
            margin: 0 12px;
            vertical-align: middle;
        }

        /* ============ 统计栏 ============ */
        .stats-bar {
            max-width: 960px;
            margin: 0 auto 28px;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
            padding: 12px 24px;
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(232,133,124,0.08);
        }
        .stat-item .stat-num {
            font-size: 1.6em;
            font-weight: 700;
            color: #d4736a;
        }
        .stat-item .stat-label {
            font-size: 0.78em;
            color: #a0807a;
            margin-top: 2px;
        }

        /* ============ 卡片容器 ============ */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
            gap: 20px;
        }
        @media (max-width: 520px) {
            .container { grid-template-columns: 1fr; padding: 0 14px 40px; }
            .header h1 { font-size: 1.55em; }
            .header { padding: 36px 16px 24px; }
            .stats-bar { gap: 16px; }
            .stat-item { padding: 10px 16px; }
        }

        /* ============ 新闻卡片 ============ */
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 26px 24px 22px;
            box-shadow: 0 2px 14px rgba(61,44,42,0.055);
            transition: all 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid rgba(232,133,124,0.09);
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #e8857c, #f0c4bd);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.28s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 36px rgba(232,133,124,0.14);
            border-color: rgba(232,133,124,0.22);
        }
        .card:hover::after {
            transform: scaleX(1);
        }

        /* 卡片顶部：来源 + 外部链接图标 */
        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .card .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78em;
            color: #a0807a;
            font-weight: 550;
            letter-spacing: 0.4px;
            background: #fdf6f3;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .card .source-badge .source-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .source-dot.tc  { background: #0a9e01; }
        .source-dot.verge { background: #6c3ec1; }
        .source-dot.hn   { background: #ff6600; }
        .source-dot.other { background: #e8857c; }

        .card .external-icon {
            opacity: 0.25;
            font-size: 0.85em;
            transition: opacity 0.25s, transform 0.25s;
        }
        .card:hover .external-icon {
            opacity: 0.65;
            transform: translate(2px, -2px);
        }

        /* 标题 */
        .card h3 {
            font-size: 1.08em;
            font-weight: 650;
            margin-bottom: 10px;
            line-height: 1.5;
            color: #3d2c2a;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 摘要 */
        .card .summary {
            font-size: 0.9em;
            color: #6b5550;
            line-height: 1.75;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 标签 */
        .card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 12px;
        }
        .card .tag {
            display: inline-block;
            background: linear-gradient(135deg, #fef3f0, #fde8e3);
            color: #b84a43;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.76em;
            font-weight: 520;
            letter-spacing: 0.3px;
            transition: background 0.2s;
        }
        .card:hover .tag {
            background: linear-gradient(135deg, #fde8e3, #fcd9d2);
        }

        /* 时间 */
        .card .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card .time {
            font-size: 0.75em;
            color: #c4aaa3;
        }
        .card .read-more {
            font-size: 0.78em;
            color: #d4736a;
            font-weight: 500;
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.25s ease;
        }
        .card:hover .read-more {
            opacity: 1;
            transform: translateX(0);
        }

        /* ============ Footer ============ */
        .footer {
            text-align: center;
            padding: 20px 20px 52px;
            color: #c4aaa3;
            font-size: 0.84em;
        }
        .footer .footer-heart {
            color: #e8857c;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }

        /* ============ 空状态 ============ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
            color: #b8958e;
        }
        .empty-state .empty-icon {
            font-size: 4em;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <!-- 顶部装饰条 -->
    <div class="header-decoration"></div>

    <!-- Header -->
    <div class="header">
        <div class="icon-row">🍩</div>
        <h1>甜甜AI日报 - {{DATE}}</h1>
        <p class="subtitle">
            精选 AI 行业资讯<span class="date-divider"></span>让阅读更甜一点
        </p>
    </div>

    <!-- 统计栏 -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-num">{{TOTAL_COUNT}}</div>
            <div class="stat-label">今日精选</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">{{SOURCE_COUNT}}</div>
            <div class="stat-label">资讯来源</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">{{TAG_COUNT}}</div>
            <div class="stat-label">覆盖主题</div>
        </div>
    </div>

    <!-- 卡片容器 -->
    <div class="container">
        {{CARDS}}
    </div>

    <!-- Footer -->
    <div class="footer">
        <span class="footer-heart">🍩</span> 甜甜AI日报 · 用心精选每日AI资讯 · {{DATE}}<br>
        <small style="opacity:0.7;">数据来源：TechCrunch · The Verge · Hacker News 等权威科技媒体</small>
    </div>
</body>
</html>
