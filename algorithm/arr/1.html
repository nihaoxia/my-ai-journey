<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //js 灵活，高级的脚本语言。不太关注内存
        // [] {} 
        // 最常用 方括号+元素
        // 如果不知道数组内的元素呢？
        const arr=['a','b','c']//特定的存储结构，一段连续的内存空间
        // 特定的行为  adt abstract data type
        arr.push(1);
        arr.push(2);
        arr.unshift(3);//
        arr.pop();
        arr.shift();
    </script>
</body>
